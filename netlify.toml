[build]
  command = """
    curl -LsSf https://astral.sh/uv/install.sh | sh
    export PATH="$HOME/.cargo/bin:$PATH"
    uv sync
    uv run zensical build
  """
  publish = "site"

[[redirects]]
  from = "/*"
  to = "/:lower"
  status = 301
  force = true

# 缓存配置保留
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 图片缓存策略 - 长期缓存（带文件名 hash）
[[headers]]
  for = "/images/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "image/webp"

[[headers]]
  for = "/images/*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"  # 30天

[[headers]]
  for = "/images/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"  # 30天

# 数学/CS 图片目录的 WebP 缓存
[[headers]]
  for = "/Mathematics/**/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/Computer Science/**/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 开启 Brotli 压缩（优先）和 Gzip 压缩
[build.environment]
  NODE_VERSION = "18"

[[plugins]]
  package = "@netlify/plugin-lighthouse"