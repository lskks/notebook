[build]
  command = "pip install zensical && zensical build"
  publish = "site"

# 暂时注释掉这个重定向规则，测试一下
# [[redirects]]
#   from = "/*"
#   to = "/404.html"
#   status = 404

# 缓存配置保留
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 图片缓存策略 - 长期缓存（带文件名 hash）
[[headers]]
  for = "/images/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "image/webp"

[[headers]]
  for = "/images/*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"  # 30天

[[headers]]
  for = "/images/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"  # 30天

# 数学/CS 图片目录的 WebP 缓存
[[headers]]
  for = "/Mathematics/**/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/Computer Science/**/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 开启 Brotli 压缩（优先）和 Gzip 压缩
[build.environment]
  NODE_VERSION = "18"

[[plugins]]
  package = "@netlify/plugin-lighthouse"